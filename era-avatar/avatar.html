<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ERA Avatar</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; font-family: monospace; cursor: pointer; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1;}
    </style>
</head>
<body>
    <div id="debug" style="position:absolute; top:0; left:0; color:red; font-size:20px; z-index:9999; background:rgba(0,0,0,0.5); padding:10px; display:block;"></div>
    <script src="https://unpkg.com/three@0.146.0/build/three.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@1.0.9/lib/three-vrm.js"></script>
    
    <script>
        function logError(msg) {
            document.getElementById('debug').innerHTML += msg + '<br>';
        }
        window.onerror = function(m, s, l, c, err) { 
            logError(m + '<br>' + (err ? err.stack : '')); 
            return false;
        };
        // Setup scene
        const scene = new THREE.Scene();
        scene.background = null;

        // Camera setup (Extreme close-up on the face)
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0.0, 1.48, 0.6); // Very close to the face

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, premultipliedAlpha: false });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        
        // Remove ACESFilmic to keep anime colors punchy
        renderer.toneMapping = THREE.NoToneMapping;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9); 
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5); 
        dirLight.position.set(1.0, 1.0, 2.0).normalize();
        scene.add(dirLight);

        let currentVrm = undefined;
        let lookAtTarget = new THREE.Object3D();
        scene.add(lookAtTarget);

        const loader = new THREE.GLTFLoader();
        
        loader.register((parser) => {
            return new THREE_VRM.VRMLoaderPlugin(parser);
        });
        
        let activeModelFile = "AmericaBlondeG.vrm";
        
        async function pollConfig() {
            try {
                const response = await fetch('config.json?t=' + new Date().getTime());
                if (response.ok) {
                    const data = await response.json();
                    if (data.model && data.model !== activeModelFile) {
                        activeModelFile = data.model;
                        loadVrm('model/' + activeModelFile);
                    }
                }
            } catch(e) { }
            setTimeout(pollConfig, 1000);
        }

        function loadVrm(url) {
            loader.load(
                url + '?t=' + new Date().getTime(),
                (gltf) => {
                    if (currentVrm) {
                        scene.remove(currentVrm.scene);
                        currentVrm.dispose();
                    }
                    
                    const vrm = gltf.userData.vrm;
                    if (!vrm) {
                        logError("Missing VRM payload in glTF. Cannot initialize character.");
                        return;
                    }
                    
                    // THREE_VRM.VRMUtils.removeUnnecessaryJoints(gltf.scene); // Disabled because it deletes Blender-exported root nodes
                    currentVrm = vrm;
                    
                    // Standard VRM models are 1 unit = 1 meter. No need to auto-scale.
                    vrm.scene.scale.set(1.0, 1.0, 1.0);
                    vrm.scene.position.set(0, 0, 0);
                    scene.add(vrm.scene);
                    
                    // Force matrix update so we can read accurate bone positions before the first render frame
                    vrm.scene.updateMatrixWorld(true);
                    
                    // Bulletproof dynamic camera framing (Locks onto the physical skeleton, ignoring corrupted bounding boxes)
                    let targetY = 1.35; // Fallback
                    const headBone = currentVrm.humanoid.getNormalizedBoneNode('head');
                    if (headBone) {
                        const headPos = new THREE.Vector3();
                        headBone.getWorldPosition(headPos);
                        targetY = headPos.y - 0.15; // Point camera at the chin/collarbone area
                    }
                    
                    logError("Target Y set to: " + targetY);
                    
                    camera.position.set(0.0, targetY + 0.1, 1.3); // Pull camera further back
                    camera.lookAt(new THREE.Vector3(0, targetY, 0));

                    vrm.lookAt.target = lookAtTarget;
                    lookAtTarget.position.set(0, targetY, 2.0);
                    vrm.scene.rotation.y = Math.PI;
                    
                    // Force arms into resting A-pose
                    const leftUpperArm = currentVrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                    if (leftUpperArm) leftUpperArm.rotation.z = 1.2;
                    const rightUpperArm = currentVrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                    if (rightUpperArm) rightUpperArm.rotation.z = -1.2;
                    
                    logError("Model loaded successfully: " + url);
                },
                undefined,
                (err) => {
                    logError("GLTF Parse Error: " + err);
                }
            );
        }

        loadVrm('model/' + activeModelFile);
        pollConfig();

        const mouse = new THREE.Vector2();
        const targetRotation = new THREE.Vector2(); 
        
        window.addEventListener('mousemove', (event) => {
            if (!currentVrm) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            targetRotation.x = mouse.x * 0.15;
            targetRotation.y = mouse.y * 0.1;
        });

        const clock = new THREE.Clock();
        let blinkTimer = 0;
        let isBlinking = false;
        
        function updateBlink(deltaTime) {
            if (!currentVrm || !currentVrm.expressionManager) return;
            
            blinkTimer += deltaTime;
            if (isBlinking) {
                if (blinkTimer > 0.1) {
                    currentVrm.expressionManager.setValue('blink', 0.0);
                    currentVrm.expressionManager.setValue('blinkLeft', 0.0);
                    isBlinking = false;
                    blinkTimer = 0;
                }
            } else {
                if (blinkTimer > 2.5 + Math.random() * 4.0) {
                    if (Math.random() < 0.15) {
                        currentVrm.expressionManager.setValue('blinkLeft', 1.0);
                    } else {
                        currentVrm.expressionManager.setValue('blink', 1.0);
                    }
                    isBlinking = true;
                    blinkTimer = 0;
                }
            }
        }

        let isSpeaking = false;
        let currentEmotion = "neutral";
        
        async function pollState() {
            try {
                const response = await fetch('state.json?t=' + new Date().getTime());
                const data = await response.json();
                isSpeaking = data.speaking;
                currentEmotion = data.emotion || "neutral";
            } catch(e) { }
            setTimeout(pollState, 100);
        }
        pollState();

        let currentRotX = 0;
        let currentRotY = 0;
        
        // Smooth values for lip sync
        let currentA = 0;
        let currentE = 0;
        let currentO = 0;
        
        // Smooth values for gestures
        let gestureWeight = 0;
        let currentNod = 0;
        
        // Emotion blending state
        const emotionInfluences = {
            'happy': 0.3, 'angry': 0, 'sad': 0, 'surprised': 0, 'relaxed': 0
        };

        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta();
            const time = clock.elapsedTime;
            
            if (currentVrm) {
                updateBlink(deltaTime);
                
                currentRotX = THREE.MathUtils.lerp(currentRotX, targetRotation.x, deltaTime * 5.0);
                currentRotY = THREE.MathUtils.lerp(currentRotY, targetRotation.y, deltaTime * 5.0);
                
                lookAtTarget.position.x = currentRotX * 3.0;
                lookAtTarget.position.y = camera.position.y + (currentRotY * 3.0);
                lookAtTarget.position.z = 2.0;

                const hips = currentVrm.humanoid.getNormalizedBoneNode('hips');
                const spine = currentVrm.humanoid.getNormalizedBoneNode('spine');
                const chest = currentVrm.humanoid.getNormalizedBoneNode('chest');
                const neck = currentVrm.humanoid.getNormalizedBoneNode('neck');
                const head = currentVrm.humanoid.getNormalizedBoneNode('head');
                const rightUpperArm = currentVrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                const rightLowerArm = currentVrm.humanoid.getNormalizedBoneNode('rightLowerArm');
                const rightHand = currentVrm.humanoid.getNormalizedBoneNode('rightHand');

                // Organic Idle Sway
                if (hips && spine && chest && head && neck) {
                    hips.position.x = Math.sin(time * 0.5) * 0.02;
                    spine.rotation.z = Math.sin(time * 0.5) * 0.02;
                    chest.rotation.x = Math.sin(time * 1.5) * 0.01; 
                    
                    const driftX = Math.sin(time * 0.7) * 0.03;
                    const driftY = Math.cos(time * 1.1) * 0.03;
                    
                    neck.rotation.y = currentRotX * 0.4 + driftX;
                    neck.rotation.x = -currentRotY * 0.4 + driftY;
                    head.rotation.y = currentRotX * 0.4;
                    head.rotation.x = -currentRotY * 0.4;
                }

                // Procedural Lip Sync & Gestures
                let targetA = 0, targetE = 0, targetO = 0;
                let targetGesture = isSpeaking ? 1.0 : 0.0;
                let targetNod = 0;
                
                if (isSpeaking) {
                    const talkSpeed = 16.0;
                    const speechWave = (Math.sin(time * talkSpeed) + Math.sin(time * talkSpeed * 1.4) + Math.sin(time * talkSpeed * 0.6)) / 3.0;
                    
                    if (speechWave > 0.3) {
                        targetA = speechWave; 
                    } else if (speechWave > -0.2) {
                        targetE = Math.abs(speechWave) * 1.5; 
                    } else {
                        targetO = Math.abs(speechWave); 
                    }
                    
                    if (speechWave > 0.6) targetNod = -0.05; 
                }
                
                // Blend lip and gesture values
                currentA = THREE.MathUtils.lerp(currentA, targetA, deltaTime * 20.0);
                currentE = THREE.MathUtils.lerp(currentE, targetE, deltaTime * 20.0);
                currentO = THREE.MathUtils.lerp(currentO, targetO, deltaTime * 20.0);
                gestureWeight = THREE.MathUtils.lerp(gestureWeight, targetGesture, deltaTime * 3.0);
                currentNod = THREE.MathUtils.lerp(currentNod, targetNod, deltaTime * 12.0); 
                
                if (head) {
                    head.rotation.x += currentNod;
                }
                
                const hips = currentVrm.humanoid.getNormalizedBoneNode('hips');
                const spine = currentVrm.humanoid.getNormalizedBoneNode('spine');
                const chest = currentVrm.humanoid.getNormalizedBoneNode('chest');
                const neck = currentVrm.humanoid.getNormalizedBoneNode('neck');
                const head = currentVrm.humanoid.getNormalizedBoneNode('head');
                
                // Organic Procedural Idle Sway (Simulating VRMA breathing)
                if (hips && spine && chest && head && neck) {
                    hips.position.x = Math.sin(time * 0.5) * 0.02;
                    spine.rotation.z = Math.sin(time * 0.5) * 0.02;
                    chest.rotation.x = Math.sin(time * 1.5) * 0.01; // Breathing simulation
                    
                    const driftX = Math.sin(time * 0.7) * 0.02;
                    const driftY = Math.cos(time * 1.1) * 0.02;
                    
                    neck.rotation.y = driftX;
                    neck.rotation.x = driftY;
                }

                // Process Emotion Targets
                if (currentVrm.expressionManager) {
                    currentVrm.expressionManager.setValue('aa', currentA);
                    currentVrm.expressionManager.setValue('ee', currentE);
                    currentVrm.expressionManager.setValue('oh', currentO);
                    
                    const targetEmotions = {
                        'happy': 0, 'angry': 0, 'sad': 0, 'surprised': 0, 'relaxed': 0
                    };
                    
                    if (currentEmotion && targetEmotions[currentEmotion] !== undefined) {
                        targetEmotions[currentEmotion] = 1.0;
                    } else {
                        targetEmotions['happy'] = 0.3;
                    }
                    
                    for (const [emo, targetVal] of Object.entries(targetEmotions)) {
                        emotionInfluences[emo] = THREE.MathUtils.lerp(emotionInfluences[emo] || 0, targetVal, deltaTime * 5.0);
                        currentVrm.expressionManager.setValue(emo, emotionInfluences[emo]);
                    }
                }

                // Force arms into a natural resting A-pose instead of a rigid T-pose
                const leftUpperArm = currentVrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                if (leftUpperArm) leftUpperArm.rotation.z = 1.2;
                
                if (rightUpperArm) rightUpperArm.rotation.z = -1.2;
                
                if (currentVrm.springBoneManager) {
                    currentVrm.springBoneManager.update(deltaTime);
                }

                currentVrm.update(deltaTime);
            }
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
